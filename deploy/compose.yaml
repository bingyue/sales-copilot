name: sales-copilot
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sales_copilot
      MYSQL_USER: sales_copilot
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h localhost --silent']
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/sales_copilot?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      DB_USERNAME: sales_copilot
      REDIS_HOST: redis
      UPLOAD_DIR: /data/upload
      SALES_CATALOG: file:/config/products.json
    volumes:
      - uploads:/data/upload
      - ./products.json:/config/products.json:ro
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
  web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8088}:80'
    volumes:
      - ../frontEnd/pc/dist:/srv/tools:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
volumes:
  mysql_data:
  redis_data:
  uploads:
